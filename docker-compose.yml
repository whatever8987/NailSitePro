version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-default_session_secret_replace_in_production}
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - salonsite-network

  # Uncomment the database service if you want to use PostgreSQL instead of in-memory storage
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=salonsite
      - POSTGRES_PASSWORD=salonsite_password
      - POSTGRES_DB=salonsite
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - salonsite-network

volumes:
  postgres-data:

networks:
  salonsite-network:
    driver: bridge